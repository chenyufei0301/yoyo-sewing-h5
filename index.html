<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>YOYO缝物所 · 手作打揽</title>
<style>
  :root {
    --cream: #FFF8F0;
    --blush: #F7E8E0;
    --rose: #D4A99A;
    --warm-brown: #8B6F5F;
    --dark: #3D322C;
    --white: #FFFFFF;
    --shadow: 0 2px 16px rgba(139, 111, 95, 0.10);
    --shadow-lg: 0 8px 32px rgba(139, 111, 95, 0.14);
    --radius: 16px;
    --radius-sm: 10px;
    --font-serif: "Noto Serif SC", "STSong", "Songti SC", "SimSun", serif;
    --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: calc(100vw / 375); }
  @media (min-width: 540px) { html { font-size: calc(540px / 375); } }
  body {
    font-family: var(--font-sans);
    font-size: 14px;
    color: var(--dark);
    background: var(--cream);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    min-height: 100vh;
  }

  /* ====== Header ====== */
  .header {
    text-align: center;
    padding: 36px 20px 24px;
    background: linear-gradient(180deg, var(--blush) 0%, var(--cream) 100%);
  }
  .header-logo {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    object-fit: contain;
    border: 3px solid var(--white);
    box-shadow: var(--shadow);
    margin-bottom: 14px;
  }
  .header-title {
    font-family: var(--font-serif);
    font-size: 24px;
    font-weight: 700;
    color: var(--warm-brown);
    letter-spacing: 3px;
  }
  .header-subtitle {
    font-size: 12px;
    color: var(--rose);
    margin-top: 8px;
    letter-spacing: 2px;
    line-height: 1.8;
  }
  .header-divider {
    width: 44px;
    height: 2px;
    background: var(--rose);
    margin: 16px auto 0;
    border-radius: 1px;
    opacity: 0.5;
  }

  /* ====== Section ====== */
  .section { padding: 24px 16px; }
  .section-title {
    font-family: var(--font-serif);
    font-size: 17px;
    font-weight: 600;
    color: var(--warm-brown);
    text-align: center;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  .section-hint {
    font-size: 11px;
    color: #C4B8AE;
    text-align: center;
    margin-bottom: 20px;
  }

  /* ====== Style Cards ====== */
  .gallery {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    padding: 0 4px;
  }
  .style-card {
    background: var(--white);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.15s;
  }
  .style-card:active { transform: scale(0.98); }
  .style-card-img-wrap {
    width: 100%;
    aspect-ratio: 3/4;
    background: linear-gradient(135deg, var(--blush), #F0E0D6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-serif);
    font-size: 32px;
    color: var(--rose);
    position: relative;
    overflow: hidden;
  }
  .style-card-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    position: absolute;
    inset: 0;
  }
  .style-card-body { padding: 10px 10px 14px; }
  .style-card-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--dark);
    margin-bottom: 4px;
  }
  .style-card-desc {
    font-size: 11px;
    color: #999;
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .style-card-tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .style-card-tag {
    font-size: 9px;
    color: var(--rose);
    border: 1px solid var(--rose);
    border-radius: 20px;
    padding: 2px 8px;
    opacity: 0.8;
  }
  .btn-order {
    display: block;
    width: 100%;
    margin-top: 10px;
    padding: 8px 0;
    background: linear-gradient(135deg, var(--warm-brown), #A08475);
    color: #fff;
    border: none;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    font-family: var(--font-sans);
    letter-spacing: 1px;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn-order:active { opacity: 0.85; }

  /* ====== Detail Modal ====== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(61, 50, 44, 0.4);
    z-index: 100;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .modal-overlay.active { opacity: 1; pointer-events: auto; }
  .modal-panel {
    background: var(--white);
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-width: 540px;
    max-height: 85vh;
    overflow-y: auto;
    padding: 0;
    transform: translateY(100%);
    transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
  }
  .modal-overlay.active .modal-panel { transform: translateY(0); }
  .modal-handle {
    width: 36px; height: 4px;
    background: #ddd; border-radius: 2px;
    margin: 14px auto 0;
  }
  /* Carousel */
  .modal-carousel {
    width: 100%;
    aspect-ratio: 4/3;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    display: flex;
    margin-top: 16px;
    scrollbar-width: none;
  }
  .modal-carousel::-webkit-scrollbar { display: none; }
  .modal-carousel-item {
    flex: 0 0 100%;
    scroll-snap-align: start;
    position: relative;
    background: linear-gradient(135deg, var(--blush), #F0E0D6);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .modal-carousel-item img {
    width: 100%; height: 100%;
    object-fit: contain;
    position: absolute; inset: 0;
  }
  .modal-carousel-placeholder {
    font-family: var(--font-serif);
    font-size: 44px;
    color: var(--rose);
    opacity: 0.5;
  }
  /* Dots */
  .modal-dots {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-top: 10px;
  }
  .modal-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #ddd;
    transition: all 0.25s;
  }
  .modal-dot.active {
    background: var(--warm-brown);
    width: 18px;
    border-radius: 3px;
  }
  /* Size / Fabric chart */
  .modal-chart {
    margin-top: 16px;
    padding: 0 16px;
  }
  .modal-chart-label {
    font-size: 11px;
    color: var(--warm-brown);
    letter-spacing: 1px;
    margin-bottom: 8px;
    font-weight: 500;
    text-align: center;
  }
  .modal-chart img {
    width: 100%;
    border-radius: var(--radius-sm);
    display: block;
  }
  .modal-body { padding: 18px 20px 30px; }
  .modal-name {
    font-family: var(--font-serif);
    font-size: 19px;
    font-weight: 600;
    color: var(--dark);
    margin-bottom: 6px;
  }
  .modal-desc {
    font-size: 13px;
    color: #888;
    line-height: 1.7;
    margin-bottom: 12px;
  }
  .modal-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
  .modal-tag {
    font-size: 10px;
    color: var(--rose);
    border: 1px solid var(--rose);
    border-radius: 20px;
    padding: 3px 10px;
  }
  .btn-go-order {
    display: block;
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--warm-brown), #A08475);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 16px;
    font-weight: 600;
    font-family: var(--font-sans);
    letter-spacing: 1px;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    transition: opacity 0.15s;
  }
  .btn-go-order:active { opacity: 0.85; }
  .modal-note {
    text-align: center;
    font-size: 11px;
    color: #C4B8AE;
    margin-top: 12px;
  }

  /* ====== Footer ====== */
  .footer {
    text-align: center;
    padding: 30px 16px 48px;
  }
  .footer-text {
    font-size: 11px;
    color: #C4B8AE;
    letter-spacing: 1px;
  }
  .footer-text .heart { color: var(--rose); }

  /* ====== Toast ====== */
  .toast {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(61, 50, 44, 0.88);
    color: #fff;
    padding: 12px 24px;
    border-radius: 24px;
    font-size: 13px;
    z-index: 999;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
</style>
</head>
<body>

<!-- ====== Header ====== -->
<header class="header">
  <img class="header-logo" src="images/logo.png" alt="YOYO缝物所"
       onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2276%22 height=%2276%22><rect fill=%22%23F7E8E0%22 width=%2276%22 height=%2276%22 rx=%2238%22/><text x=%2238%22 y=%2250%22 text-anchor=%22middle%22 font-size=%2230%22>🧵</text></svg>'">
  <h1 class="header-title">YOYO缝物所</h1>
  <p class="header-subtitle">· 手作打揽 · 用心缝制 ·<br>一个热爱缝纫的女生，接一些自己也会想穿的衣服</p>
  <div class="header-divider"></div>
</header>

<!-- ====== Style Gallery ====== -->
<section class="section">
  <h2 class="section-title">✨ 快来挑选你喜欢的款式吧！</h2>
  <p class="section-hint">点击款式查看详情，选择后提交排单</p>
  <div class="gallery" id="gallery"></div>
</section>

<footer class="footer">
  <p class="footer-text">YOYO缝物所 <span class="heart">♥</span> 手作温暖生活</p>
</footer>

<!-- ====== Detail Modal ====== -->
<div class="modal-overlay" id="modal">
  <div class="modal-panel" id="modalPanel">
    <div class="modal-handle"></div>
    <div class="modal-carousel" id="modalCarousel"></div>
    <div class="modal-dots" id="modalDots"></div>
    <div class="modal-chart" id="modalSizeChart" style="display:none;">
      <div class="modal-chart-label">📐 尺码参考</div>
      <img id="modalSizeImg" src="" alt="尺码表">
    </div>
    <div class="modal-chart" id="modalFabricChart" style="display:none;">
      <div class="modal-chart-label">🧵 用料说明</div>
      <img id="modalFabricImg" src="" alt="用料表">
    </div>
    <div class="modal-body">
      <div class="modal-name" id="modalName"></div>
      <div class="modal-desc" id="modalDesc"></div>
      <div class="modal-tags" id="modalTags"></div>
      <a class="btn-go-order" id="btnGoOrder" href="#" target="_blank">
        📝 我要排这个款
      </a>
      <p class="modal-note">将跳转到飞书表单填写码数、联系方式等信息</p>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ==================== DATA ====================
// ★ 修改这里的款式：name=名称, desc=描述, img=图片路径(空则显示编号), tags=标签
const STYLES = [
  { id:'HQ068',  name:'Doen同款打揽连衣裙',            desc:'Doen经典同款，优雅复古方领设计，精致打揽褶皱，裙摆飘逸灵动，法式田园风满满。',          imgs:['images/HQ068-1.jpg','images/HQ068-2.jpg'],                              sizeImg:'images/HQ068-SIZE.JPG',  fabricImg:'',                     tags:['法式','田园','复古'] },
  { id:'HQ115',  name:'bishop打揽短袖连衣裙/上衣',      desc:'经典bishop袖设计，短袖轻盈舒适，打揽收腰显瘦，可作连衣裙或上衣两穿。',               imgs:['images/HQ115-1.JPG'],                                                    sizeImg:'images/HQ115-size.JPG',  fabricImg:'',                     tags:['两穿','显瘦','经典'] },
  { id:'HQ11501',name:'bishop前开襟短袖打揽连衣裙/上衣', desc:'bishop前开襟设计，短袖轻盈，打揽褶皱精致，可单穿可叠穿，通勤休闲皆宜。',              imgs:['images/HQ11501-1.jpg'],                                                  sizeImg:'images/HQ11501-SIZE.JPG',fabricImg:'',                     tags:['前开襟','短袖','精致'] },
  { id:'HQ11502',name:'bishop短袖半袖打揽连衣裙/上衣',   desc:'bishop半袖设计，恰到好处的袖长修饰手臂，打揽工艺精致，日常百搭不挑场合。',            imgs:['images/HQ11502-1.JPG','images/HQ11502-2.JPG','images/HQ11502-3.jpg','images/HQ11502-4.jpg','images/HQ11502-5.JPG'], sizeImg:'images/HQ11502-SIZE.JPG',fabricImg:'', tags:['半袖','百搭','精致'] },
  { id:'HQ148',  name:'娃娃领打揽连衣裙',               desc:'可爱娃娃领设计，打揽工艺精致，宽松舒适不挑身材，文艺复古风满满。',                    imgs:['images/HQ148-1.JPG'],                                                    sizeImg:'images/HQ148-SIZE.JPG',  fabricImg:'images/HQ148-fabric.JPG', tags:['娃娃领','宽松','文艺'] },
  { id:'HQ150',  name:'bishop打揽长袖连衣裙/上衣',      desc:'优雅bishop长袖设计，打揽贴合身形，复古气质，春秋单穿或叠穿皆宜。',                  imgs:['images/HQ150-1.JPG'],                                                    sizeImg:'images/HQ150-size.JPG',  fabricImg:'',                     tags:['长袖','复古','气质'] },
  { id:'HQ15001',name:'bishop前开襟长袖打揽连衣裙/上衣', desc:'bishop前开襟长袖设计，打揽收腰显瘦，复古优雅，春秋季节首选单品。',                  imgs:['images/HQ15001-1.jpg','images/HQ15001-2.jpg','images/HQ15001-3.jpg'],    sizeImg:'images/HQ15001-size.JPG',fabricImg:'',                     tags:['前开襟','长袖','优雅'] },
  { id:'HQ162',  name:'方领胸前打揽连衣裙',             desc:'复古方领设计，胸前精致打揽褶皱，收腰显瘦，经典百搭，日常约会皆宜。',                  imgs:['images/HQ162-1.JPG'],                                                    sizeImg:'images/HQ162-size.JPG',  fabricImg:'',                     tags:['方领','显瘦','经典'] },
  { id:'HQ175',  name:'小飞袖打揽连衣裙（大袖版）',      desc:'灵动小飞袖设计，大袖版更显飘逸浪漫，打揽收腰修饰比例，甜美又气质。',                 imgs:['images/HQ175-1.JPG','images/HQ175-2.JPG','images/HQ175-3.JPG'],          sizeImg:'images/HQ175-size.JPG',  fabricImg:'',                     tags:['小飞袖','甜美','飘逸'] },
  { id:'WL001',  name:'小飞袖打揽上衣（小袖版）',        desc:'精致小飞袖设计，小袖版利落干练，打揽贴合身形，百搭上衣单品，配裙配裤都好看。',        imgs:['images/wl001-1.jpg','images/wl001-2.jpg'],                               sizeImg:'images/wl001-size.png',  fabricImg:'',                     tags:['小飞袖','百搭','干练'] },
];

// ★ 将此处替换为你的飞书表单分享链接
//    在飞书中打开 Base → 点击表单视图 → 分享 → 复制链接
const FORM_SHARE_URL = 'https://baijinghudong.feishu.cn/share/base/form/shrcn8kGCDj7AbxuPuLgkel9Vkf';

// ==================== RENDER ====================
const gallery = document.getElementById('gallery');
STYLES.forEach((s, i) => {
  const card = document.createElement('div');
  card.className = 'style-card';

  const firstImg = s.imgs && s.imgs.length > 0 ? s.imgs[0] : '';
  const imgHtml = firstImg
    ? `<img src="${firstImg}" alt="${s.name}" onerror="this.style.display='none'">`
    : '';
  const tagsHtml = s.tags.map(t => `<span class="style-card-tag">${t}</span>`).join('');

  card.innerHTML = `
    <div class="style-card-img-wrap">${(i+1)}${imgHtml}</div>
    <div class="style-card-body">
      <div class="style-card-name">${s.name}</div>
      <div class="style-card-desc">${s.desc}</div>
      <div class="style-card-tags">${tagsHtml}</div>
      <button class="btn-order" data-idx="${i}">查看 & 排单 →</button>
    </div>`;

  card.querySelector('.btn-order').onclick = (e) => {
    e.stopPropagation();
    openModal(i);
  };
  card.querySelector('.style-card-img-wrap').onclick = () => openModal(i);

  gallery.appendChild(card);
});

// ==================== MODAL ====================
const modal = document.getElementById('modal');
const panel = document.getElementById('modalPanel');

function openModal(idx) {
  const s = STYLES[idx];

  // --- Carousel ---
  const carousel = document.getElementById('modalCarousel');
  let carouselHtml = '';
  const imgs = s.imgs && s.imgs.length > 0 ? s.imgs : null;
  if (imgs) {
    imgs.forEach((img, i) => {
      carouselHtml += `<div class="modal-carousel-item"><img src="${img}" alt="${s.name} ${i+1}"></div>`;
    });
  } else {
    carouselHtml = `<div class="modal-carousel-item"><span class="modal-carousel-placeholder">${idx+1}</span></div>`;
  }
  carousel.innerHTML = carouselHtml;
  carousel.scrollLeft = 0;

  // --- Dots ---
  const dotsEl = document.getElementById('modalDots');
  const count = imgs ? imgs.length : 1;
  if (count > 1) {
    dotsEl.innerHTML = Array.from({length: count}, (_, i) =>
      `<span class="modal-dot${i === 0 ? ' active' : ''}" data-idx="${i}"></span>`
    ).join('');
    dotsEl.style.display = 'flex';
  } else {
    dotsEl.innerHTML = '';
    dotsEl.style.display = 'none';
  }

  // --- Size chart ---
  const sizeChart = document.getElementById('modalSizeChart');
  const sizeImg = document.getElementById('modalSizeImg');
  if (s.sizeImg) {
    sizeImg.src = s.sizeImg;
    sizeImg.onerror = function() { sizeChart.style.display = 'none'; };
    sizeChart.style.display = 'block';
  } else {
    sizeChart.style.display = 'none';
  }

  // --- Fabric chart ---
  const fabricChart = document.getElementById('modalFabricChart');
  const fabricImg = document.getElementById('modalFabricImg');
  if (s.fabricImg) {
    fabricImg.src = s.fabricImg;
    fabricImg.onerror = function() { fabricChart.style.display = 'none'; };
    fabricChart.style.display = 'block';
  } else {
    fabricChart.style.display = 'none';
  }

  document.getElementById('modalName').textContent = s.name;
  document.getElementById('modalDesc').textContent = s.desc;
  document.getElementById('modalTags').innerHTML = s.tags.map(t => `<span class="modal-tag">${t}</span>`).join('');

  const btn = document.getElementById('btnGoOrder');
  btn.href = FORM_SHARE_URL;
  btn.onclick = function(e) {
    window.open(FORM_SHARE_URL, '_blank');
    showToast('已为你打开排单表单 📋\n款式：' + s.name);
    closeModal();
    e.preventDefault();
  };

  modal.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  modal.classList.remove('active');
  document.body.style.overflow = '';
}

modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

	// Carousel scroll → update dots
	document.getElementById('modalCarousel').addEventListener('scroll', function() {
	  const w = this.offsetWidth;
	  if (w <= 0) return;
	  const idx = Math.round(this.scrollLeft / w);
	  document.querySelectorAll('#modalDots .modal-dot').forEach((d, i) => {
	    d.classList.toggle('active', i === idx);
	  });
	});

// Swipe down to close
let tsY = 0;
panel.addEventListener('touchstart', e => { tsY = e.touches[0].clientY; }, { passive: true });
panel.addEventListener('touchmove', e => {
  if (panel.scrollTop <= 0 && e.touches[0].clientY - tsY > 60) closeModal();
}, { passive: true });

// ==================== TOAST ====================
let tt;
function showToast(msg) {
  const t = document.getElementById('toast');
  clearTimeout(tt);
  t.innerHTML = msg.replace(/\n/g, '<br>');
  t.className = 'toast show';
  tt = setTimeout(() => { t.className = 'toast'; }, 2500);
}

// Check if form URL is configured
if (FORM_SHARE_URL.includes('FORM_TOKEN_PLACEHOLDER')) {
  console.warn('⚠️ 请将 FORM_SHARE_URL 替换为你的飞书表单分享链接');
}
</script>

</body>
</html>
