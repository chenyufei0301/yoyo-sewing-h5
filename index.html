<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>YOYO缝物所 · 手作打揽</title>
<style>
  :root {
    --cream: #FFF8F0;
    --blush: #F7E8E0;
    --rose: #D4A99A;
    --warm-brown: #8B6F5F;
    --dark: #3D322C;
    --white: #FFFFFF;
    --shadow: 0 2px 16px rgba(139, 111, 95, 0.10);
    --shadow-lg: 0 8px 32px rgba(139, 111, 95, 0.14);
    --radius: 16px;
    --radius-sm: 10px;
    --font-serif: "Noto Serif SC", "STSong", "Songti SC", "SimSun", serif;
    --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: calc(100vw / 375); }
  @media (min-width: 540px) { html { font-size: calc(540px / 375); } }
  body {
    font-family: var(--font-sans);
    font-size: 14px;
    color: var(--dark);
    background: var(--cream);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    min-height: 100vh;
  }

  /* ====== Header ====== */
  .header {
    text-align: center;
    padding: 36px 20px 24px;
    background: linear-gradient(180deg, var(--blush) 0%, var(--cream) 100%);
  }
  .header-logo {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid var(--white);
    box-shadow: var(--shadow);
    margin-bottom: 14px;
  }
  .header-title {
    font-family: var(--font-serif);
    font-size: 24px;
    font-weight: 700;
    color: var(--warm-brown);
    letter-spacing: 3px;
  }
  .header-subtitle {
    font-size: 12px;
    color: var(--rose);
    margin-top: 8px;
    letter-spacing: 2px;
    line-height: 1.8;
  }
  .header-divider {
    width: 44px;
    height: 2px;
    background: var(--rose);
    margin: 16px auto 0;
    border-radius: 1px;
    opacity: 0.5;
  }

  /* ====== Section ====== */
  .section { padding: 24px 16px; }
  .section-title {
    font-family: var(--font-serif);
    font-size: 17px;
    font-weight: 600;
    color: var(--warm-brown);
    text-align: center;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  .section-hint {
    font-size: 11px;
    color: #C4B8AE;
    text-align: center;
    margin-bottom: 20px;
  }

  /* ====== Style Cards ====== */
  .gallery {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    padding: 0 4px;
  }
  .style-card {
    background: var(--white);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.15s;
  }
  .style-card:active { transform: scale(0.98); }
  .style-card-img-wrap {
    width: 100%;
    aspect-ratio: 3/4;
    background: linear-gradient(135deg, var(--blush), #F0E0D6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-serif);
    font-size: 32px;
    color: var(--rose);
    opacity: 0.7;
    position: relative;
    overflow: hidden;
  }
  .style-card-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    position: absolute;
    inset: 0;
  }
  .style-card-body { padding: 10px 10px 14px; }
  .style-card-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--dark);
    margin-bottom: 4px;
  }
  .style-card-desc {
    font-size: 11px;
    color: #999;
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .style-card-tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .style-card-tag {
    font-size: 9px;
    color: var(--rose);
    border: 1px solid var(--rose);
    border-radius: 20px;
    padding: 2px 8px;
    opacity: 0.8;
  }
  .btn-order {
    display: block;
    width: 100%;
    margin-top: 10px;
    padding: 8px 0;
    background: linear-gradient(135deg, var(--warm-brown), #A08475);
    color: #fff;
    border: none;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    font-family: var(--font-sans);
    letter-spacing: 1px;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn-order:active { opacity: 0.85; }

  /* ====== Detail Modal ====== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(61, 50, 44, 0.4);
    z-index: 100;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .modal-overlay.active { opacity: 1; pointer-events: auto; }
  .modal-panel {
    background: var(--white);
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-width: 540px;
    max-height: 80vh;
    overflow-y: auto;
    padding: 0;
    transform: translateY(100%);
    transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
  }
  .modal-overlay.active .modal-panel { transform: translateY(0); }
  .modal-handle {
    width: 36px; height: 4px;
    background: #ddd; border-radius: 2px;
    margin: 14px auto 0;
  }
  .modal-img {
    width: 100%;
    aspect-ratio: 4/3;
    background: linear-gradient(135deg, var(--blush), #F0E0D6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-serif);
    font-size: 40px;
    color: var(--rose);
    opacity: 0.7;
    margin-top: 16px;
    position: relative;
  }
  .modal-img img {
    width: 100%; height: 100%;
    object-fit: cover;
    position: absolute; inset: 0;
  }
  .modal-body { padding: 18px 20px 30px; }
  .modal-name {
    font-family: var(--font-serif);
    font-size: 19px;
    font-weight: 600;
    color: var(--dark);
    margin-bottom: 6px;
  }
  .modal-desc {
    font-size: 13px;
    color: #888;
    line-height: 1.7;
    margin-bottom: 12px;
  }
  .modal-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
  .modal-tag {
    font-size: 10px;
    color: var(--rose);
    border: 1px solid var(--rose);
    border-radius: 20px;
    padding: 3px 10px;
  }
  .btn-go-order {
    display: block;
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--warm-brown), #A08475);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 16px;
    font-weight: 600;
    font-family: var(--font-sans);
    letter-spacing: 1px;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    transition: opacity 0.15s;
  }
  .btn-go-order:active { opacity: 0.85; }
  .modal-note {
    text-align: center;
    font-size: 11px;
    color: #C4B8AE;
    margin-top: 12px;
  }

  /* ====== Footer ====== */
  .footer {
    text-align: center;
    padding: 30px 16px 48px;
  }
  .footer-text {
    font-size: 11px;
    color: #C4B8AE;
    letter-spacing: 1px;
  }
  .footer-text .heart { color: var(--rose); }

  /* ====== Toast ====== */
  .toast {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(61, 50, 44, 0.88);
    color: #fff;
    padding: 12px 24px;
    border-radius: 24px;
    font-size: 13px;
    z-index: 999;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
</style>
</head>
<body>

<!-- ====== Header ====== -->
<header class="header">
  <img class="header-logo" src="images/logo.png" alt="YOYO缝物所"
       onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2276%22 height=%2276%22><rect fill=%22%23F7E8E0%22 width=%2276%22 height=%2276%22 rx=%2238%22/><text x=%2238%22 y=%2250%22 text-anchor=%22middle%22 font-size=%2230%22>🧵</text></svg>'">
  <h1 class="header-title">YOYO缝物所</h1>
  <p class="header-subtitle">· 手作打揽 · 用心缝制 ·<br>挑选心仪的款式，轻松排单</p>
  <div class="header-divider"></div>
</header>

<!-- ====== Style Gallery ====== -->
<section class="section">
  <h2 class="section-title">✨ 可排款式</h2>
  <p class="section-hint">点击款式查看详情，选择后提交排单</p>
  <div class="gallery" id="gallery"></div>
</section>

<footer class="footer">
  <p class="footer-text">YOYO缝物所 <span class="heart">♥</span> 手作温暖生活</p>
</footer>

<!-- ====== Detail Modal ====== -->
<div class="modal-overlay" id="modal">
  <div class="modal-panel" id="modalPanel">
    <div class="modal-handle"></div>
    <div class="modal-img" id="modalImg"></div>
    <div class="modal-body">
      <div class="modal-name" id="modalName"></div>
      <div class="modal-desc" id="modalDesc"></div>
      <div class="modal-tags" id="modalTags"></div>
      <a class="btn-go-order" id="btnGoOrder" href="#" target="_blank">
        📝 我要排这个款
      </a>
      <p class="modal-note">将跳转到飞书表单填写码数、联系方式等信息</p>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ==================== DATA ====================
// ★ 修改这里的款式：name=名称, desc=描述, img=图片路径(空则显示编号), tags=标签
const STYLES = [
  { id:'S01', name:'经典方领打揽衫',     desc:'复古方领设计，精致打揽褶皱，日常百搭款，棉质面料柔软亲肤，春秋单穿或内搭皆宜。',     img:'', tags:['经典款','通勤','百搭'] },
  { id:'S02', name:'圆领泡泡袖打揽衫',   desc:'甜美泡泡袖设计，圆领修饰脸型，松紧打揽贴合身形，少女感满满，约会出游首选。',       img:'', tags:['甜美','约会','少女'] },
  { id:'S03', name:'V领收腰打揽连衣裙',  desc:'优雅V领拉长颈部线条，收腰打揽显瘦，裙摆飘逸灵动，一件搞定约会通勤。',           img:'', tags:['显瘦','优雅','连衣裙'] },
  { id:'S04', name:'一字肩打揽上衣',     desc:'浪漫一字肩设计，露出锁骨和肩线，松紧打揽舒适不滑落，度假拍照超出片。',         img:'', tags:['约会','度假','性感'] },
  { id:'S05', name:'荷叶边打揽半裙',     desc:'灵动荷叶边裙摆，打揽腰头舒适不勒，走路带风，搭配任意上衣都好看。',             img:'', tags:['半裙','灵动','百搭'] },
  { id:'S06', name:'娃娃领打揽衬衫',     desc:'可爱娃娃领设计，宽松版型不挑身材，文艺复古风，搭配牛仔裤或半裙都好看。',       img:'', tags:['文艺','宽松','复古'] },
  { id:'S07', name:'吊带打揽连衣裙',     desc:'细吊带+打揽胸围设计，清凉夏日必备，度假出游拍照超出片，可单穿可叠穿。',        img:'', tags:['吊带','夏日','度假'] },
  { id:'S08', name:'抽褶打揽阔腿裤',     desc:'高腰抽褶打揽设计，垂感阔腿版型，显高显瘦，舒适与时髦兼得。',                 img:'', tags:['裤装','显高','舒适'] },
  { id:'S09', name:'中式立领打揽上衣',   desc:'新中式立领设计，手工打揽+盘扣细节，东方韵味与现代剪裁的完美融合。',           img:'', tags:['新中式','气质','国风'] },
  { id:'S10', name:'蕾丝拼接打揽衫',     desc:'法式蕾丝拼接袖口和下摆，精致打揽细节，浪漫中带着一丝少女的俏皮。',           img:'', tags:['蕾丝','法式','浪漫'] },
];

// ★ 将此处替换为你的飞书表单分享链接
//    在飞书中打开 Base → 点击表单视图 → 分享 → 复制链接
const FORM_SHARE_URL = 'https://baijinghudong.feishu.cn/share/base/form/shrcn8kGCDj7AbxuPuLgkel9Vkf';

// ==================== RENDER ====================
const gallery = document.getElementById('gallery');
STYLES.forEach((s, i) => {
  const card = document.createElement('div');
  card.className = 'style-card';

  const imgHtml = s.img
    ? `<img src="${s.img}" alt="${s.name}" onerror="this.style.display='none'">`
    : '';
  const tagsHtml = s.tags.map(t => `<span class="style-card-tag">${t}</span>`).join('');

  card.innerHTML = `
    <div class="style-card-img-wrap">${(i+1)}${imgHtml}</div>
    <div class="style-card-body">
      <div class="style-card-name">${s.name}</div>
      <div class="style-card-desc">${s.desc}</div>
      <div class="style-card-tags">${tagsHtml}</div>
      <button class="btn-order" data-idx="${i}">查看 & 排单 →</button>
    </div>`;

  card.querySelector('.btn-order').onclick = (e) => {
    e.stopPropagation();
    openModal(i);
  };
  card.querySelector('.style-card-img-wrap').onclick = () => openModal(i);

  gallery.appendChild(card);
});

// ==================== MODAL ====================
const modal = document.getElementById('modal');
const panel = document.getElementById('modalPanel');

function openModal(idx) {
  const s = STYLES[idx];
  const imgEl = document.getElementById('modalImg');
  imgEl.innerHTML = s.img
    ? `<img src="${s.img}" alt="${s.name}" onerror="this.style.display='none'">${idx+1}`
    : (idx+1);

  document.getElementById('modalName').textContent = s.name;
  document.getElementById('modalDesc').textContent = s.desc;
  document.getElementById('modalTags').innerHTML = s.tags.map(t => `<span class="modal-tag">${t}</span>`).join('');

  // Pre-fill style name in form if possible, otherwise just open the form
  const btn = document.getElementById('btnGoOrder');
  // Try to pass style name as URL param (some form platforms support this)
  btn.href = FORM_SHARE_URL;
  btn.onclick = function(e) {
    // Open Feishu form in new window
    window.open(FORM_SHARE_URL, '_blank');
    showToast('已为你打开排单表单 📋\n款式：' + s.name);
    closeModal();
    e.preventDefault();
  };

  modal.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  modal.classList.remove('active');
  document.body.style.overflow = '';
}

modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

// Swipe down to close
let tsY = 0;
panel.addEventListener('touchstart', e => { tsY = e.touches[0].clientY; }, { passive: true });
panel.addEventListener('touchmove', e => {
  if (panel.scrollTop <= 0 && e.touches[0].clientY - tsY > 60) closeModal();
}, { passive: true });

// ==================== TOAST ====================
let tt;
function showToast(msg) {
  const t = document.getElementById('toast');
  clearTimeout(tt);
  t.innerHTML = msg.replace(/\n/g, '<br>');
  t.className = 'toast show';
  tt = setTimeout(() => { t.className = 'toast'; }, 2500);
}

// Check if form URL is configured
if (FORM_SHARE_URL.includes('FORM_TOKEN_PLACEHOLDER')) {
  console.warn('⚠️ 请将 FORM_SHARE_URL 替换为你的飞书表单分享链接');
}
</script>

</body>
</html>
